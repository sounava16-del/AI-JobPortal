services:
  # ============================================================================
  # 1. Backend Web Service (Node.js + Express + Socket.io + Groq AI)
  # ============================================================================
  - type: web
    name: ai-job-portal-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # MongoDB Atlas connection string (mongodb+srv://...)
      - key: MONGODB_URI
        sync: false
      # Groq AI API Key (from console.groq.com/keys)
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: STORAGE_TYPE
        value: local

  # ============================================================================
  # 2. Frontend Static Site (React + Vite + Tailwind)
  # ============================================================================
  - type: static
    name: ai-job-portal-frontend
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-job-portal-api
          property: host
